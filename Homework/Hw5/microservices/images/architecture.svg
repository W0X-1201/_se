<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="900" height="600" fill="#0f172a"/>

  <text x="450" y="40" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Docker 微服務系統架構</text>

  <!-- Browser -->
  <rect x="360" y="70" width="180" height="54" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="450" y="95" fill="#e2e8f0" font-size="14" text-anchor="middle">瀏覽器</text>
  <text x="450" y="113" fill="#94a3b8" font-size="12" text-anchor="middle">http://localhost</text>

  <!-- Arrow browser -> nginx -->
  <line x1="450" y1="124" x2="450" y2="168" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nginx -->
  <rect x="330" y="170" width="240" height="60" rx="10" fill="#065f46" stroke="#10b981"/>
  <text x="450" y="196" fill="#ecfdf5" font-size="15" font-weight="700" text-anchor="middle">Nginx（反向代理）:80</text>
  <text x="450" y="215" fill="#a7f3d0" font-size="12" text-anchor="middle">系統唯一入口</text>

  <!-- fan-out arrows -->
  <line x1="450" y1="230" x2="450" y2="255" stroke="#38bdf8" stroke-width="2"/>
  <line x1="170" y1="255" x2="730" y2="255" stroke="#38bdf8" stroke-width="2"/>
  <line x1="170" y1="255" x2="170" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="255" x2="450" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="255" x2="730" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="170" y="272" fill="#7dd3fc" font-size="11" text-anchor="middle">/ &amp; /api/</text>
  <text x="450" y="272" fill="#7dd3fc" font-size="11" text-anchor="middle">/node/</text>
  <text x="730" y="272" fill="#7dd3fc" font-size="11" text-anchor="middle">/rust/</text>

  <!-- Python -->
  <rect x="70" y="300" width="200" height="70" rx="10" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="170" y="328" fill="#eff6ff" font-size="14" font-weight="700" text-anchor="middle">python-app :8000</text>
  <text x="170" y="347" fill="#bfdbfe" font-size="12" text-anchor="middle">FastAPI（主要）</text>
  <text x="170" y="363" fill="#93c5fd" font-size="11" text-anchor="middle">Web 介面 + API</text>

  <!-- Node -->
  <rect x="350" y="300" width="200" height="70" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="450" y="328" fill="#f0fdf4" font-size="14" font-weight="700" text-anchor="middle">node-app :3000</text>
  <text x="450" y="347" fill="#bbf7d0" font-size="12" text-anchor="middle">Node.js / Express</text>
  <text x="450" y="363" fill="#86efac" font-size="11" text-anchor="middle">次要服務</text>

  <!-- Rust -->
  <rect x="630" y="300" width="200" height="70" rx="10" fill="#7c2d12" stroke="#f97316"/>
  <text x="730" y="328" fill="#fff7ed" font-size="14" font-weight="700" text-anchor="middle">rust-app :8080</text>
  <text x="730" y="347" fill="#fed7aa" font-size="12" text-anchor="middle">Rust（std）</text>
  <text x="730" y="363" fill="#fdba74" font-size="11" text-anchor="middle">次要服務</text>

  <!-- Python -> Postgres -->
  <line x1="170" y1="370" x2="170" y2="440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="410" fill="#7dd3fc" font-size="11">讀寫</text>

  <!-- Postgres -->
  <rect x="70" y="442" width="200" height="70" rx="10" fill="#312e81" stroke="#6366f1"/>
  <text x="170" y="470" fill="#eef2ff" font-size="14" font-weight="700" text-anchor="middle">db :5432</text>
  <text x="170" y="489" fill="#c7d2fe" font-size="12" text-anchor="middle">PostgreSQL 16</text>
  <text x="170" y="505" fill="#a5b4fc" font-size="11" text-anchor="middle">volume: postgres_data</text>

  <!-- backend network box -->
  <rect x="45" y="280" width="810" height="250" rx="16" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="60" y="562" fill="#94a3b8" font-size="12">所有容器位於同一個 bridge 網路 backend，以服務名稱互連（只有 nginx 對外開放 80）</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>

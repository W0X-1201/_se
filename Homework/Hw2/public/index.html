<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教務系統登入 - NQU</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-head">
            <h2>NQU 校務資訊系統</h2>
            <p>請使用學號／教職員帳號登入</p>
        </div>
        <div class="login-body">
            <div class="form-row">
                <label for="studentId">帳號（學號／教職員編號）</label>
                <input type="text" id="studentId" placeholder="請輸入帳號" autocomplete="username">
            </div>
            <div class="form-row">
                <label for="password">密碼</label>
                <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password">
            </div>
            <button class="btn" onclick="doLogin()">登　入</button>
            <div class="login-msg" id="message"></div>
            <div class="login-note">
                測試帳號：<br>
                學生（資工）123456 / 123456<br>
                學生（資管）123457 / 123457<br>
                教師　111111 / 111111（另有 111112～111114，密碼同帳號）<br>
                管理員　admin / 123456
            </div>
        </div>
    </div>

    <script>
        async function doLogin() {
            const studentId = document.getElementById('studentId').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId, password })
                });
                const data = await response.json();

                if (data.success) {
                    msgDiv.style.color = '#1e7a45';
                    msgDiv.innerText = data.message;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    const home = data.user.role === 'admin' ? '/admin.html'
                        : data.user.role === 'teacher' ? '/teacher.html'
                        : '/dashboard.html';
                    setTimeout(() => { window.location.href = home; }, 500);
                } else {
                    msgDiv.style.color = '#a92c2c';
                    msgDiv.innerText = data.message;
                }
            } catch (error) {
                msgDiv.style.color = '#a92c2c';
                msgDiv.innerText = '無法連線到伺服器';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
